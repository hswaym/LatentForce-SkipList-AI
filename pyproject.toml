[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skiplist"
version = "0.1.0"
description = "Pre-migration code-triage tool — finds dead and duplicate code in legacy Python codebases."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "hswaym"}
]
dependencies = [
    "networkx>=2.5",
    "pytest>=7.0.0",
]

[project.scripts]
skiplist = "skiplist.cli:main"

[tool.setuptools.packages.find]
where = ["."]
